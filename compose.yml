services:
  collector:
    build: .
    entrypoint: ["node", "collector/src/main.ts"]
    volumes:
      - ./data:/data
  publisher:
    build: .
    entrypoint: ["node", "publisher/src/main.ts"]
    volumes:
      - ./data:/data
  site-build:
    build: .
    profiles: ["publish"]
    entrypoint: ["node", "site/publish.ts"]
    volumes:
      - ./data:/data:ro
      - ./site-out:/app/site-out
  site:
    image: nginx:alpine
    volumes:
      - ./site-out:/usr/share/nginx/html:ro
      - ./site/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
