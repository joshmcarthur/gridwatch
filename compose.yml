services:
  collector:
    build: .
    entrypoint: ["node", "collector/src/main.ts"]
    volumes:
      - ./data:/data
  publisher:
    build: .
    entrypoint: ["node", "publisher/src/main.ts"]
    volumes:
      - ./data:/data
  # Build first: npm run build -w site
  site:
    image: nginx:alpine
    volumes:
      - ./site/dist:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
